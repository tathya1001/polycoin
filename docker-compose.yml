services:
  db:
    image: postgres:16
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER"]
      interval: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"
    # The image's default is the production start script; locally we want auto-reload.
    command: python manage.py runserver 0.0.0.0:8000
    env_file: .env
    volumes:
      - ./backend:/app
    extra_hosts:
      # Ollama runs on the host, not in a container. Docker Desktop resolves this name
      # already; Linux needs this line.
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - BACKEND_INTERNAL_URL=http://backend:8000
      - WATCHPACK_POLLING=true
    depends_on: [backend]

  # Authenticated front door for the host's Ollama, which has no auth of its own. Only starts
  # with `docker compose --profile gateway up -d ollama-gateway`, so a plain `up` is unchanged.
  ollama-gateway:
    image: caddy:2.10-alpine
    profiles: ["gateway"]
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # Not `:?`: compose would then demand the token even for a plain `docker compose up`.
      # The Caddyfile rejects every request when the token is empty or shorter than 32 chars.
      - OLLAMA_GATEWAY_TOKEN=${OLLAMA_GATEWAY_TOKEN:-}
    volumes:
      - ./ollama-gateway/Caddyfile:/etc/caddy/Caddyfile:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  pgdata:
