name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR cancels the old run; runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Third-party actions are pinned to commit SHAs (a tag can be moved to malicious code; a SHA
# can't). Dependabot's github-actions ecosystem keeps these current.
#   actions/checkout@v6      d23441a48e516b6c34aea4fa41551a30e30af803
#   actions/setup-python@v6  ece7cb06caefa5fff74198d8649806c4678c61a1
#   actions/setup-node@v6    249970729cb0ef3589644e2896645e5dc5ba9c38

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_DB: polycoin
          POSTGRES_USER: polycoin
          POSTGRES_PASSWORD: polycoin
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U polycoin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # CI-only throwaway values. They're public in this file and must never be used anywhere else.
      DATABASE_URL: postgres://polycoin:polycoin@localhost:5432/polycoin
      DJANGO_SECRET_KEY: ci-only-QpZ7v2Lk9WmX4tR8nB3cY6hJ1sD5fG0aE2uI7oP4lK9jH3gF6dS
      JWT_SIGNING_KEY: ci-only-jwt-Ns8Vb2Xm5Qw9Er3Ty6Ui1Op4As7Df0Gh2Jk5Lz8Xc1Vb4Nm7
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: http://localhost:3000
      FIELD_ENCRYPTION_KEYS: v1:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      FIELD_ENCRYPTION_ACTIVE_KEY: v1
      AUTH_COOKIE_SECURE: "FALSE"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Every model change has a migration
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        run: pytest -q
      - name: Production settings pass Django's deploy checks
        env:
          DJANGO_PRODUCTION: "TRUE"
          AUTH_COOKIE_SECURE: "TRUE"
        run: python manage.py check --deploy --fail-level WARNING

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      BACKEND_INTERNAL_URL: http://localhost:8000  # only so the build's rewrite compiles
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Next generates route types (LayoutProps, PageProps) into .next/types; a fresh checkout
      # has none, so generate them before type-checking.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  deploy:
    needs: [backend, frontend]
    # Only real pushes to main deploy (or a manual run on main), never PRs; fork PRs get no
    # secrets anyway. DEPLOY_ENABLED is a repo variable you set to "true" once Render and
    # Vercel exist.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ vars.FRONTEND_URL }}
    # Two deploys must never overlap; a second one waits for the first.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      BACKEND_URL: ${{ vars.BACKEND_URL }}
      FRONTEND_URL: ${{ vars.FRONTEND_URL }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_CLI_VERSION: "64.4.0"
    steps:
      # A missing or misnamed secret arrives as an empty string, and the failure then surfaces
      # steps later, far from its cause. Fail here instead, naming what's missing (never values).
      - name: Check deploy secrets and variables are set
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          missing=0
          for name in DATABASE_URL RENDER_DEPLOY_HOOK_URL VERCEL_TOKEN VERCEL_ORG_ID \
                      VERCEL_PROJECT_ID BACKEND_URL FRONTEND_URL; do
            if [ -z "${!name}" ]; then echo "::error::$name is empty or not set"; missing=1; fi
          done
          case "$DATABASE_URL" in
            ""|postgres://*|postgresql://*) ;;
            *) echo "::error::DATABASE_URL must start with postgresql:// (copy the string, not the psql command)"; missing=1 ;;
          esac
          exit $missing

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # Release step: schema changes go live once, before any new code. Render Free has no
      # pre-deploy command, so this is where migrations run. They use the same code that is
      # about to be deployed, so migrations must stay backward compatible with the code that
      # is still serving ("expand, then contract"). Only DATABASE_URL is real: `migrate` needs
      # none of the other secrets, so throwaway values keep production keys out of GitHub.
      - name: Migrate the production database
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DJANGO_PRODUCTION: "TRUE"
          DJANGO_SECRET_KEY: release-step-only
          JWT_SIGNING_KEY: release-step-only
          DJANGO_ALLOWED_HOSTS: localhost
          CSRF_TRUSTED_ORIGINS: http://localhost
          FIELD_ENCRYPTION_KEYS: v1:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          FIELD_ENCRYPTION_ACTIVE_KEY: v1
        run: |
          pip install -r requirements.txt
          python manage.py migrate --noinput
          python manage.py createcachetable

      - name: Deploy backend on Render (this exact commit)
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          # A pasted secret can carry a stray newline or space, which curl rejects as malformed.
          hook=$(printf '%s' "$HOOK" | tr -d '[:space:]')
          case "$hook" in
            https://*'?key='*) ;;
            *) echo "::error::RENDER_DEPLOY_HOOK_URL should look like https://api.render.com/deploy/srv-...?key=..."; exit 1 ;;
          esac
          curl -fsS -X POST "$hook&ref=$GITHUB_SHA" > /dev/null

      - name: Wait until Render serves this commit
        run: |
          for i in $(seq 1 60); do
            commit=$(curl -fsS --max-time 30 "$BACKEND_URL/api/ping/" | jq -r .commit || true)
            if [ "$commit" = "$GITHUB_SHA" ]; then echo "Backend is live on $commit"; exit 0; fi
            echo "Attempt $i: backend reports '${commit:-unreachable}', waiting..."
            sleep 15
          done
          echo "Render did not start serving $GITHUB_SHA within ~15 minutes"; exit 1

      - name: Backend can reach the database
        run: curl -fsS --max-time 60 "$BACKEND_URL/api/health/"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20

      - name: Deploy frontend on Vercel
        run: |
          npm install --global "vercel@$VERCEL_CLI_VERSION"
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Smoke test the whole chain (browser → Vercel → Render)
        run: curl -fsS "$FRONTEND_URL/api/ping/" | jq -e --arg sha "$GITHUB_SHA" '.commit == $sha'
