name: Keep-alive

# Render's free web service sleeps after 15 minutes without traffic, and waking takes ~1 minute.
#
# This is only a FALLBACK. GitHub runs scheduled workflows on a best-effort basis and throttles them
# hard on quiet repositories: asked for every 10 minutes, it ran every 2-6 hours, so the service
# still slept. The real keep-alive is an external uptime monitor calling the same /api/ping/ every
# 5 minutes (see the deploy notes).
#
# Every 5 minutes (GitHub's shortest interval), at minutes 2, 7, 12, ... 57: offset from the top of
# the hour, when GitHub's scheduled-run queue is longest.
on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the backend (no database access, so Neon still sleeps)
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: curl -fsS --retry 3 --retry-delay 10 --max-time 90 "$BACKEND_URL/api/ping/"
